name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ meadow-3.0, develop ]
  push:
    branches: [ meadow-3.0, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release Source/Meadow.CLI.sln

      - name: Unit tests
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName~.Unit.Tests" Source/Meadow.CLI.sln

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Meadow.CLI-${{ github.sha }}
          path: Source/Meadow.CLI/bin/Release/*.nupkg
